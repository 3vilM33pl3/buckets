[package]
name = "buckets-tui"
version = "0.4.1"
edition = "2021"

[[bin]]
name = "buckets-tui"
path = "src/main.rs"

[dependencies]
buckets = { path = ".." }
ratatui = "0.29"
crossterm = "0.28"
tokio = { version = "1.0", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
tokio-postgres = { version = "0.7.10", features = ["with-uuid-1", "with-chrono-0_4"] }
log = "0.4.27"
env_logger = "0.11.8"
uuid = { version = "1.17.0", features = ["v4"] }
chrono = "0.4.41"
unicode-width = "0.2"

[lints.clippy]
unwrap_used = "deny"
