[package]
name = "buckets-server"
version = "0.4.1"
edition = "2021"

[[bin]]
name = "buckets-server"
path = "src/main.rs"

[dependencies]
buckets = { path = ".." }
axum = "0.8"
tokio = { version = "1.0", features = ["rt", "rt-multi-thread", "macros", "signal"] }
tokio-postgres = { version = "0.7.10", features = ["with-uuid-1", "with-chrono-0_4"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.17.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tower-http = { version = "0.6", features = ["cors"] }
log = "0.4"
env_logger = "0.11"
clap = { version = "4.5", features = ["derive"] }
thiserror = "2.0"

[lints.clippy]
unwrap_used = "deny"
