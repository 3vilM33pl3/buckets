[workspace]
members = [".", "buckets-tui", "buckets-server"]

[package]
name = "buckets"
version = "0.4.1"
edition = "2021"

[lib]
name = "buckets"
path = "src/lib.rs"

[[bin]]
name = "buckets"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.40", features = ["derive"] }
clap_complete = "4.5.40"
once_cell = "1.21.3"
log = "0.4.27"
env_logger = "0.11.8"
postgres = "0.19.9"
tokio = { version = "1.0", features = ["rt", "rt-multi-thread", "macros"] }
tokio-postgres = { version = "0.7.10", features = ["with-uuid-1", "with-chrono-0_4"] }
pgvector = { version = "0.4", features = ["postgres"] }
candle-core = "0.7.1"
candle-nn = "0.7.1"
candle-transformers = "0.7.1"
tokenizers = { version = "0.19.1", default-features = false, features = ["onig"] }
hf-hub = "0.3.2"
deadpool-postgres = "0.11.0"
refinery = { version = "0.8.14", features = ["tokio-postgres"] }
tempfile = "3.20.0"
assert_cmd = "2.0.17"
toml = "0.8.23"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.133"
uuid = { version = "1.17.0", features = ["v4", "serde"] }
serde_derive = "1.0.219"
blake3 = "1.8.2"
walkdir = "2.5.0"
predicates = "3.1.3"
zstd = "0.13.2"
thiserror = "2.0.12"
chrono = { version = "0.4.41", features = ["serde"] }
arrow = "55.1.0"
dirs = "5.0"
ntp = "0.5.0"
async-trait = "0.1.83"
dialoguer = "0.11"

[dev-dependencies]
serial_test = "3.2"
testcontainers = "0.15"

[features]
default = []

[lints.clippy]
unwrap_used = "deny"
