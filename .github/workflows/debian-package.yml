name: Build Debian Package

on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'debian/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/debian-package.yml'
  workflow_dispatch:

jobs:
  build-deb:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: nightly-2025-01-15
        override: true
        components: rustfmt, clippy

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y dpkg-dev debhelper devscripts pkg-config libssl-dev

    - name: Build Debian package
      run: |
        dpkg-buildpackage -us -uc -b -j$(nproc)
        
    - name: Move built packages
      run: |
        mkdir -p debian-packages
        mv ../buckets_*.deb debian-packages/ || true
        mv ../buckets_*.buildinfo debian-packages/ || true
        mv ../buckets_*.changes debian-packages/ || true
        
    - name: Upload Debian package artifacts
      uses: actions/upload-artifact@v4
      with:
        name: debian-packages
        path: debian-packages/
        
    - name: Test package installation
      run: |
        sudo dpkg -i debian-packages/buckets_*.deb
        buckets --version
        
    - name: Create Release (on tag push)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: debian-packages/buckets_*.deb
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}