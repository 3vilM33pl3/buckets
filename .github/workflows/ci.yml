name: Rust

on:
  push:
    branches: ["main"]
    tags:
      - 'v*.*.*'    
  pull_request:
    branches: ["main"]
  workflow_dispatch:
  
permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      # Removed dtolnay/rust-toolchain to prevent overriding local toolchains on self-hosted runners.
      # GitHub-hosted runners have Rust pre-installed.
      
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --all-features

      - name: Test
        run: cargo test --release

      # Linux-specific steps
      - name: Install Coverage Tools (Linux)
        if: matrix.os == 'ubuntu-latest'
        uses: taiki-e/install-action@cargo-llvm-cov
      
      - name: Install Nextest (Linux)
        if: matrix.os == 'ubuntu-latest'
        uses: taiki-e/install-action@cargo-nextest

      - name: Generate code coverage (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: cargo llvm-cov nextest --all-features --workspace --lcov --output-path lcov.info

      - name: Upload coverage to Codecov (Linux)
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info

      - name: Build Debian package (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo install cargo-deb
          cargo deb --no-build

      # MacOS-specific steps
      - name: Package MacOS Binary
        if: matrix.os == 'macos-latest'
        run: |
          tar -czf buckets-macos-universal.tar.gz -C target/release buckets

      # Upload Artifacts
      - name: Upload Debian package (Linux)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: debian-package
          path: target/debian/*.deb
          if-no-files-found: error

      - name: Upload MacOS Artifact
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: macos-binary
          path: buckets-macos-universal.tar.gz
          if-no-files-found: error

      # Release Creation
      - name: Create Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            target/debian/*.deb
            buckets-macos-universal.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
